name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install pinned dependencies"
        run: python -m pip install -r requirements.txt

      - name: "Run tests (offline: committed extracts and results only, no network access needed)"
        run: python -m pytest

      - name: "Regenerate README and brief from results/*.json and check they match the committed ones"
        run: |
          python scripts/make_report.py
          git diff --stat --exit-code -- README.md docs/brief.md
